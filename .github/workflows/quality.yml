name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # same ruff as the dev extra, so a new release can't change the rules under us
      - name: Install ruff
        run: python -m pip install "$(grep -o 'ruff==[0-9.]*' pyproject.toml)"

      - name: Run Ruff
        run: ruff check custom_components tests

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # compat mode puts the repo on sys.path directly - HA's loader
          # can't find custom_components through setuptools' finder hook
          python -m pip install -e ".[dev]" --config-settings editable_mode=compat

      - name: Run pytest
        run: pytest -q tests
