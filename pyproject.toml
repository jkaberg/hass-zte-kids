[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-zte-kids"
version = "0.5.0"
description = "Home Assistant integration for ZTE Kids."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Joel Kåberg"},
]
dependencies = [
  "cryptography>=44",
  "httpx>=0.27,<1",
  "paho-mqtt>=1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-homeassistant-custom-component>=0.13,<0.14",
  "ruff==0.16.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.zte_kids" = ["manifest.json", "translations/*.json", "brand/*.png"]
"custom_components.zte_kids.sdk" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
