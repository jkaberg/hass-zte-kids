[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-zte-kids"
version = "0.1.0"
description = "Home Assistant integration for ZTE Kids."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "GitHub Copilot"},
]
dependencies = [
  "cryptography>=46,<47",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-homeassistant-custom-component>=0.13,<0.14",
  "ruff>=0.11,<0.12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.zte_kids" = ["manifest.json", "translations/*.json", "brand/*.png"]
"custom_components.zte_kids.sdk" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
